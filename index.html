<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; text-align: center; max-width: 400px; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; font-size: 2rem; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; }
        .badge { background-color: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; display: inline-block; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Developer Profile</h1>
        <p><strong>Specialization:</strong> Computer Science Engineering<br>(Cybersecurity)</p>
        <p><strong>Environment:</strong> Docker Containerization</p>
        <div class="badge">Deployment Status: Live</div>
    </div>
</body>
</html>
